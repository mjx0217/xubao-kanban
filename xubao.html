    <div class="stat-card"><div class="stat-card-label">续报率</div><div class="stat-card-value" id="scRate">-</div></div>
    <div class="stat-card"><div class="stat-card-label">目标完成率</div><div class="stat-card-value" id="scComplete">-</div></div>
    <div class="stat-card"><div class="stat-card-label">今日增长</div><div class="stat-card-value" id="scDaily">-</div></div>
  </div>
  <div class="legend-bar">
    <span class="legend-label">目标完成率</span>
    <div class="legend-gradient">
      <div class="legend-gradient-bar" id="legendBar"></div>
      <div class="legend-endpoints"><span id="legendMin">0%</span><span id="legendMax">100%</span></div>
    </div>
    <span style="color:#aaa;font-size:11px">越高越绿 · 越低越红</span>
    <span style="margin-left:auto;font-size:11px;color:#aaa">数据更新时间：<span id="updateTime">-</span></span>
  </div>

  <!-- 学科汇总 -->
  <div class="table-section">
    <div class="table-section-header" id="hdr-subjects" onclick="toggleSection('subjects')">
      <span class="table-section-title">📚 学科汇总</span>
      <span class="table-section-meta" id="subjectMeta"></span>
      <span class="accordion-arrow">▼</span>
    </div>
    <div class="table-section-body" id="subjectsBody">
      <table><thead id="subjectsHead"></thead><tbody id="subjectsTable"></tbody></table>
    </div>
  </div>

  <!-- 教学组汇总 -->
  <div class="table-section">
    <div class="table-section-header" id="hdr-groups" onclick="toggleSection('groups')">
      <span class="table-section-title">👥 教学组汇总</span>
      <span class="table-section-meta" id="groupMeta"></span>
      <span class="accordion-arrow">▼</span>
    </div>
    <div class="table-section-body" id="groupsBody">
      <table><thead id="groupsHead"></thead><tbody id="groupsTable"></tbody></table>
    </div>
  </div>

  <!-- 班主任明细 -->
  <div class="table-section">
    <div class="table-section-header" id="hdr-ct" onclick="toggleSection('ct')">
      <span class="table-section-title">🏫 班主任明细</span>
      <span class="table-section-meta" id="ctMeta"></span>
      <span class="accordion-arrow">▼</span>
    </div>
    <div class="search-bar">
      <input class="search-input" id="searchInput" placeholder="搜索班主任姓名..." oninput="filterCT()">
    </div>
    <div class="group-filter" id="groupFilterBtns"></div>
    <div class="table-section-body" id="ctBody">
      <table><thead id="ctHead"></thead><tbody id="ctTable"></tbody></table>
    </div>
  </div>
</div>

<div class="footer">续报完成率看板 · 实时数据</div>

<script>
(function() {
  // ─── State ────────────────────────────────────────────────────────────────
  var rawData = {};
  var currentGroup = '全部';
  var searchText = '';
  var sortState = {
    subjects: { col: 'completeRate', dir: 'desc' },
    groups:   { col: 'completeRate', dir: 'desc' },
    ct:       { col: 'completeRate', dir: 'desc' }
  };
  var globalRateMin = 0, globalRateMax = 100;

  var COLS = {
    subjects: [
      { key: 'name',         label: '学科',       numeric: false },
      { key: 'inclass',      label: '在班人次',   numeric: true  },
      { key: 'xubao',        label: '续报人次',   numeric: true  },
      { key: 'target',       label: '目标人次',   numeric: true  },
      { key: 'gap',          label: '距完标人次', numeric: true  },
      { key: 'daily',        label: '今日增长',   numeric: true  },
      { key: 'rate',         label: '续报率',     numeric: true  },
      { key: 'completeRate', label: '目标完成率', numeric: true  },
    ],
    groups: [
      { key: 'name',         label: '教学组',     numeric: false },
      { key: 'ctCount',      label: '班主任数',   numeric: true  },
      { key: 'inclass',      label: '在班人次',   numeric: true  },
      { key: 'xubao',        label: '续报人次',   numeric: true  },
      { key: 'target',       label: '目标人次',   numeric: true  },
      { key: 'gap',          label: '距完标人次', numeric: true  },
      { key: 'daily',        label: '今日增长',   numeric: true  },
      { key: 'rate',         label: '续报率',     numeric: true  },
      { key: 'completeRate', label: '目标完成率', numeric: true  },
    ],
    ct: [
      { key: 'name',         label: '班主任',     numeric: false },
      { key: 'group',        label: '教学组',     numeric: false },
      { key: 'subjects',     label: '学科',       numeric: false },
      { key: 'inclass',      label: '在班人次',   numeric: true  },
      { key: 'xubao',        label: '续报人次',   numeric: true  },
      { key: 'target',       label: '目标人次',   numeric: true  },
      { key: 'gap',          label: '距完标人次', numeric: true  },
      { key: 'daily',        label: '今日增长',   numeric: true  },
      { key: 'rate',         label: '续报率',     numeric: true  },
      { key: 'completeRate', label: '目标完成率', numeric: true  },
    ]
  };

  // ─── Color helpers ───────────────────────────────────────────────────────
  function rateColorHex(rate) {
    rate = Math.max(0, Math.min(100, rate));
    var r, g, b;
    if (rate <= 50) {
      var t = rate / 50;
      r = 220; g = Math.round(38 + (179 - 38) * t); b = 38;
    } else {
      var t = (rate - 50) / 50;
      r = Math.round(234 + (22 - 234) * t);
      g = Math.round(179 + (163 - 179) * t);
      b = Math.round(8 + (74 - 8) * t);
    }
    return '#' + [r, g, b].map(function(x) { return x.toString(16).padStart(2, '0'); }).join('');
  }

  function normalizeRate(rate) {
    if (globalRateMax === globalRateMin) return 50;
    return Math.max(0, Math.min(100, (rate - globalRateMin) / (globalRateMax - globalRateMin) * 100));
  }

  function fmt(n) { return n.toLocaleString(); }

  function buildLegend() {
    var bar = document.getElementById('legendBar');
    var stops = [];
    for (var i = 0; i <= 20; i++) stops.push(rateColorHex(i * 5) + ' ' + (i / 20 * 100) + '%');
    bar.style.background = 'linear-gradient(to right, ' + stops.join(', ') + ')';
    document.getElementById('legendMin').textContent = globalRateMin.toFixed(1) + '%';
    document.getElementById('legendMax').textContent = globalRateMax.toFixed(1) + '%';
  }

  // ─── Cell renderers ─────────────────────────────────────────────────────
  function makeRateBar(rate) {
    var color = rateColorHex(normalizeRate(rate));
    var display = rate > 999 ? '>999' : rate.toFixed(1);
    return '<div class="rate-bar-wrap"><div class="rate-bar-bg"><div class="rate-bar-fill" style="width:' + Math.min(100, rate) + '%;background:' + color + '"></div></div><span class="rate-text" style="color:' + color + '">' + display + '%</span></div>';
  }

  function makeGapBar(gap, xubao, target) {
    if (target <= 0) return '<span class="gap-text">—</span>';
    if (xubao >= target) {
      return '<span class="gap-text" style="color:#16a34a;font-weight:700">已完成 ✓</span>';
    }
    var achieved = xubao / target * 100;
    var color = rateColorHex(normalizeRate(achieved));
    return '<div class="gap-bar-wrap"><div class="gap-bar-bg"><div class="gap-bar-fill" style="width:' + achieved.toFixed(1) + '%;background:' + color + '"></div></div><span class="gap-text" style="color:' + color + '">' + fmt(gap) + '</span></div>';
  }

  function makeDailyBadge(daily, maxDaily, medianDaily) {
    if (daily <= 0) return '<span class="daily-badge" style="background:#f0f0f0;color:#bbb">0</span>';
    var bg, text = '#fff';
    if (daily >= maxDaily) {
      bg = '#15803d';
    } else if (daily >= medianDaily) {
      var t = (daily - medianDaily) / (maxDaily - medianDaily);
      var r = Math.round(34  + (21 - 34) * t);
      var g = Math.round(197 + (128 - 197) * t);
      var b = Math.round(100 + (61 - 100) * t);
      bg = 'rgb(' + r + ',' + g + ',' + b + ')';
    } else {
      var t2 = daily / Math.max(medianDaily, 1);
      var r2 = Math.round(220 + (34 - 220) * t2);
      var g2 = Math.round(240 + (197 - 240) * t2);
      var b2 = Math.round(230 + (100 - 230) * t2);
      bg = 'rgb(' + r2 + ',' + g2 + ',' + b2 + ')';
    }
    return '<span class="daily-badge" style="background:' + bg + ';color:' + text + '">+' + fmt(daily) + '</span>';
  }

  // ─── Sort ────────────────────────────────────────────────────────────────
  function applySort(data, tableKey) {
    var col = sortState[tableKey].col;
    var dir = sortState[tableKey].dir;
    var colDef = COLS[tableKey].find(function(c) { return c.key === col; });
    return data.slice().sort(function(a, b) {
      var av = a[col], bv = b[col];
      if (col === 'subjects') { av = Array.isArray(av) ? av.join() : ''; bv = Array.isArray(bv) ? bv.join() : ''; }
      if (colDef && colDef.numeric) { av = Number(av) || 0; bv = Number(bv) || 0; }
      if (av < bv) return dir === 'asc' ? -1 : 1;
      if (av > bv) return dir === 'asc' ? 1 : -1;
      return 0;
    });
  }

  function buildThead(tableKey) {
    var thead = document.getElementById(tableKey + 'Head');
    var state = sortState[tableKey];
    var cols = COLS[tableKey];
    var html = '<tr>';
    cols.forEach(function(c) {
      var isActive = state.col === c.key;
      var icon = isActive ? (state.dir === 'asc' ? '↑' : '↓') : '↕';
      html += '<th data-col="' + c.key + '" data-table="' + tableKey + '" class="' + (isActive ? 'sort-' + state.dir : '') + '">' + c.label + '<span class="sort-icon">' + icon + '</span></th>';
    });
    html += '</tr>';
    thead.innerHTML = html;
    thead.querySelectorAll('th').forEach(function(th) {
      th.addEventListener('click', function() { handleSort(th.dataset.table, th.dataset.col); });
    });
  }

  function handleSort(table, col) {
    var s = sortState[table];
    if (s.col === col) { s.dir = s.dir === 'asc' ? 'desc' : 'asc'; }
    else { s.col = col; s.dir = 'desc'; }
    buildThead(table);
    renderTable(table);
  }

  // ─── Section toggle ──────────────────────────────────────────────────────
  function toggleSection(name) {
    var header = document.getElementById('hdr-' + name);
    var body = document.getElementById(name + 'Body');
    header.classList.toggle('open');
    body.classList.toggle('collapsed');
  }

  // ─── Render ──────────────────────────────────────────────────────────────
  function getFilteredCT() {
    var list = rawData.classTeachers || [];
    if (currentGroup !== '全部') list = list.filter(function(c) { return c.group === currentGroup; });
    if (searchText) list = list.filter(function(c) { return c.name.toLowerCase().indexOf(searchText) !== -1; });
    return list;
  }

  function renderTable(tableKey) {
    var tbody = document.getElementById(tableKey + 'Table');
    var cols = COLS[tableKey];
    var data;
    if (tableKey === 'ct') {
      data = applySort(getFilteredCT(), 'ct');
      var dailies = data.map(function(c) { return c.daily || 0; }).sort(function(a, b) { return a - b; });
      var maxDaily = dailies[dailies.length - 1] || 0;
      var medianDaily = dailies[Math.floor(dailies.length / 2)] || 0;
      data._badgeStats = { max: maxDaily, median: medianDaily };
    } else {
      data = applySort(rawData[tableKey] || [], tableKey);
    }

    var html = '';
    data.forEach(function(row) {
      html += '<tr>';
      cols.forEach(function(c) {
        var val = row[c.key];
        if (c.key === 'name') { html += '<td class="td-name">' + val + '</td>'; return; }
        if (c.key === 'group') { html += '<td>' + val + '</td>'; return; }
        if (c.key === 'subjects') {
          var tags = Array.isArray(val) ? val.map(function(s) { return '<span class="subject-tag">' + s + '</span>'; }).join('') : val;
          html += '<td><div class="subject-tags">' + tags + '</div></td>'; return;
        }
        if (c.key === 'completeRate') { html += '<td><div class="rate-cell">' + makeRateBar(val) + '</div></td>'; return; }
        if (c.key === 'gap') {
          if (tableKey === 'ct') { html += '<td><div class="gap-cell">' + makeGapBar(val, row.xubao, row.target) + '</div></td>'; }
          else { html += '<td>' + fmt(val) + '</td>'; }
          return;
        }
        if (c.key === 'daily') {
          if (tableKey === 'ct') { html += '<td>' + makeDailyBadge(val, data._badgeStats.max, data._badgeStats.median) + '</td>'; }
          else { html += '<td>+' + fmt(val) + '</td>'; }
          return;
        }
        if (c.key === 'rate') { html += '<td>' + val.toFixed(1) + '%</td>'; return; }
        if (c.numeric) { html += '<td>' + fmt(val) + '</td>'; return; }
        html += '<td>' + val + '</td>';
      });
      html += '</tr>';
    });
    tbody.innerHTML = html;
  }

  function renderSubjects() {
    buildThead('subjects');
    renderTable('subjects');
    document.getElementById('subjectMeta').textContent = '共 ' + (rawData.subjects || []).length + ' 个学科';
  }

  function renderGroups() {
    buildThead('groups');
    renderTable('groups');
    document.getElementById('groupMeta').textContent = '共 ' + (rawData.groups || []).length + ' 个教学组';
  }

  function renderGroupFilter() {
    var container = document.getElementById('groupFilterBtns');
    var allGroups = ['全部'].concat((rawData.classTeachers || []).reduce(function(acc, c) {
      if (acc.indexOf(c.group) === -1) acc.push(c.group); return acc;
    }, [])).sort();
    container.innerHTML = allGroups.map(function(g) {
      return '<button class="filter-btn ' + (g === currentGroup ? 'active' : '') + '" onclick="setGroup(\'' + g + '\')">' + g + '</button>';
    }).join('');
  }

  function setGroup(g) {
    currentGroup = g;
    renderGroupFilter();
    buildThead('ct');
    renderTable('ct');
    document.getElementById('ctMeta').textContent = '共 ' + getFilteredCT().length + ' 位班主任';
  }

  function filterCT() {
    searchText = document.getElementById('searchInput').value.trim().toLowerCase();
    buildThead('ct');
    renderTable('ct');
    document.getElementById('ctMeta').textContent = '共 ' + getFilteredCT().length + ' 位班主任';
  }

  function renderHeader() {
    var m = rawData.meta || {};
    var f = function(n) { return n.toLocaleString(); };

    document.getElementById('totalInclass').textContent = f(m.totalInclass || 0);
    document.getElementById('totalXubao').textContent = f(m.totalXubao || 0);
    document.getElementById('totalTarget').textContent = f(m.totalTarget || 0);
    document.getElementById('totalGap').textContent = f(m.totalGap || 0);
    document.getElementById('totalDaily').textContent = '+' + f(m.totalDaily || 0);
    document.getElementById('scXubao').textContent = f(m.totalXubao || 0);
    document.getElementById('scTarget').textContent = f(m.totalTarget || 0);
    document.getElementById('scGap').textContent = f(m.totalGap || 0);
    document.getElementById('scRate').textContent = (m.totalRate || 0) + '%';
    document.getElementById('scComplete').textContent = (m.totalCompleteRate || 0) + '%';
    document.getElementById('scDaily').textContent = '+' + f(m.totalDaily || 0);
    document.getElementById('updateTime').textContent = m.updated || '-';

    // Delta section
    if (m.prevXubao !== undefined) {
      var dx = (m.totalXubao || 0) - m.prevXubao;
      var dg = (m.totalGap || 0) - m.prevGap;
      var dd = (m.totalDaily || 0) - m.prevDaily;

      document.getElementById('sPrevXubao').textContent = f(m.prevXubao);
      document.getElementById('sCurrXubao').textContent = f(m.totalXubao || 0);
      var dxEl = document.getElementById('sDeltaXubao');
      dxEl.textContent = (dx >= 0 ? '（+' : '（') + dx.toLocaleString() + '）';
      dxEl.className = 's-delta ' + (dx >= 0 ? 'delta-good' : 'delta-bad');

      document.getElementById('sPrevGap').textContent = f(m.prevGap);
      document.getElementById('sCurrGap').textContent = f(m.totalGap || 0);
      var dgEl = document.getElementById('sDeltaGap');
      if (dg <= 0) {
        dgEl.textContent = '（减少了' + Math.abs(dg).toLocaleString() + '）';
        dgEl.className = 's-delta delta-good';
      } else {
        dgEl.textContent = '（增加了' + dg.toLocaleString() + '）';
        dgEl.className = 's-delta delta-bad';
      }

      var ddEl = document.getElementById('sDeltaDaily');
      ddEl.textContent = (dd >= 0 ? '+' : '') + dd.toLocaleString();
      ddEl.className = 's-delta ' + (dd >= 0 ? 'delta-good' : 'delta-bad');

      // Time range
      try {
        var prevTime = new Date(m.prevUpdated.replace(' ', 'T'));
        var currTime = new Date(m.updated.replace(' ', 'T'));
        var diffMs = currTime - prevTime;
        var prevStr = m.prevUpdated.slice(-5);
        var currStr = m.updated.slice(-5);
        var intervalStr;
        if (diffMs >= 86400000) {
          var days = Math.floor(diffMs / 86400000);
          var hrs = Math.round((diffMs % 86400000) / 3600000);
          intervalStr = prevStr + ' → ' + currStr + '（+' + days + '天' + hrs + '小时）';
        } else if (diffMs >= 3600000) {
          intervalStr = prevStr + ' → ' + currStr + '（+' + Math.round(diffMs / 3600000) + '小时）';
        } else {
          intervalStr = prevStr + ' → ' + currStr + '（+' + Math.round(diffMs / 60000) + '分钟）';
        }
        document.getElementById('timeRange').textContent = '数据区间：' + intervalStr;
      } catch(e) {
        document.getElementById('timeRange').textContent = '数据区间：' + (m.updated || '');
      }
    } else {
      document.getElementById('timeRange').textContent = '数据区间：' + (m.updated || '?') + '（首版）';
      document.getElementById('sCurrXubao').textContent = f(m.totalXubao || 0);
      document.getElementById('sCurrGap').textContent = f(m.totalGap || 0);
      document.getElementById('sDeltaDaily').textContent = '+' + f(m.totalDaily || 0);
      document.getElementById('sDeltaDaily').className = 's-delta delta-good';
      document.getElementById('sPrevXubao').textContent = '—';
      document.getElementById('sPrevGap').textContent = '—';
      document.getElementById('sDeltaXubao').textContent = '';
      document.getElementById('sDeltaGap').textContent = '';
    }
  }

  // Expose global for onclick handlers
  window.setGroup = setGroup;
  window.filterCT = filterCT;
  window.toggleSection = toggleSection;

  // ─── Init ───────────────────────────────────────────────────────────────
  function init(d) {
    console.warn('[KANBAN] init called, ctCount=' + (d.classTeachers ? d.classTeachers.length : 0));
    rawData = d;

    // Rate range
    var allRates = (d.classTeachers || []).map(function(c) { return c.completeRate || 0; });
    globalRateMin = Math.min.apply(null, allRates);
    globalRateMax = Math.max.apply(null, allRates);

    buildLegend();
    renderHeader();
    renderSubjects();
    renderGroups();
    renderGroupFilter();
    renderTable('ct');
    renderTable('subjects');
    renderTable('groups');

    // Open all sections
    ['hdr-subjects', 'hdr-groups', 'hdr-ct'].forEach(function(id) {
      document.getElementById(id).classList.add('open');
    });
  }

  // Load data - try JSON file first, fall back to embedded
  // 内嵌数据（由构建脚本注入）
  function loadData() {
    if (window.INJECTED_DATA) {
      console.warn('[KANBAN] using injected data, ctCount=' + (window.INJECTED_DATA.classTeachers ? window.INJECTED_DATA.classTeachers.length : 0));
      console.warn('[KANBAN] init starting...');
      init(window.INJECTED_DATA);
    } else {
      console.warn('[KANBAN] INJECTED_DATA is null, falling back to fetch');
      var xhr = new XMLHttpRequest();
      xhr.open('GET', 'xubao_data.json?t=' + Date.now(), true);
      xhr.onload = function() {
        if (xhr.status === 200 || xhr.status === 0) {
          try {
            init(JSON.parse(xhr.responseText));
          } catch(e) {
            alert('JSON解析失败: ' + e);
          }
        } else {
          alert('数据加载失败，HTTP ' + xhr.status);
        }
      };
      xhr.onerror = function() { alert('网络请求失败，请检查网络连接'); };
      xhr.send();
    }
  }

  loadData();
})();
</script>
</body>
</html>
