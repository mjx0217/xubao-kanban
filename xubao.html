<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>沈阳基地·续报完成率看板</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: #f2f4f8;
  color: #333;
  min-height: 100vh;
}

/* Header */
.header {
  background: linear-gradient(135deg, #059669, #047857);
  color: white;
  padding: 18px 32px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  flex-wrap: wrap;
  gap: 12px;
}
.header h1 { font-size: 20px; font-weight: 600; letter-spacing: 0.5px; }
.header-right {
  display: flex;
  gap: 20px;
  align-items: center;
  font-size: 14px;
  flex-wrap: wrap;
}
.header-stat { text-align: center; min-width: 70px; }
.header-stat-val { font-size: 22px; font-weight: 700; }
.header-stat-label { font-size: 12px; opacity: 0.85; margin-top: 1px; }
.refresh-btn {
  background: rgba(255,255,255,0.15);
  border: 1px solid rgba(255,255,255,0.3);
  color: white;
  padding: 7px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 13px;
  transition: background 0.15s;
}
.refresh-btn:hover { background: rgba(255,255,255,0.25); }

/* Main content */
.content { padding: 20px 32px; max-width: 1400px; margin: 0 auto; }

/* Stat cards */
.stat-cards {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 14px;
  margin-bottom: 20px;
}
.stat-card {
  background: white;
  border-radius: 12px;
  padding: 16px 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  border: 1px solid #f0f0f5;
  display: flex;
  flex-direction: column;
  gap: 4px;
  text-align: center;
}
.stat-card-label { font-size: 12px; color: #888; font-weight: 500; }
.stat-card-value { font-size: 26px; font-weight: 700; color: #333; }
.stat-card-sub { font-size: 11px; color: #aaa; }

/* Sections */
.table-section {
  background: white;
  border-radius: 12px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  border: 1px solid #f0f0f5;
  margin-bottom: 20px;
  overflow: hidden;
}
.table-section-header {
  padding: 14px 20px;
  border-bottom: 2px solid #f0f0f5;
  display: flex;
  align-items: center;
  gap: 10px;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
.table-section-header:hover { background: #f8f9ff; }
.table-section-title { font-size: 15px; font-weight: 600; color: #059669; flex: 1; }
.table-section-meta { font-size: 12px; color: #aaa; }
.accordion-arrow { font-size: 12px; color: #888; transition: transform 0.2s; }
.table-section-header.open .accordion-arrow { transform: rotate(180deg); }
.table-section-body { overflow-x: auto; }
.table-section-body.collapsed { display: none; }

table { width: 100%; border-collapse: collapse; font-size: 13px; min-width: 800px; }
thead th {
  background: #fafafa;
  padding: 10px 8px;
  text-align: center;
  font-weight: 500;
  color: #888;
  font-size: 12px;
  border-bottom: 1px solid #f0f0f5;
  white-space: nowrap;
  cursor: pointer;
  user-select: none;
  transition: background 0.15s;
}
thead th:hover { background: #e8f0fe; }
thead th.sort-asc { color: #059669; }
thead th.sort-desc { color: #059669; }
.sort-icon { margin-left: 3px; font-size: 10px; opacity: 0.6; }
thead th.sort-asc .sort-icon,
thead th.sort-desc .sort-icon { opacity: 1; }

tbody tr { border-bottom: 1px solid #f5f5f5; }
tbody tr:last-child { border-bottom: none; }
tbody tr:hover { background: #f8f9ff; }
tbody td { padding: 10px 8px; color: #333; text-align: center; vertical-align: middle; }
.td-name { text-align: left; font-weight: 600; }

/* Rate bar */
.rate-cell { text-align: center; }
.rate-bar-wrap { display: flex; align-items: center; gap: 6px; justify-content: center; }
.rate-bar-bg { width: 60px; height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
.rate-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.rate-text { font-weight: 700; font-size: 13px; min-width: 44px; }

/* Gap bar — shows how close to target completion */
.gap-cell { min-width: 100px; }
.gap-bar-wrap { display: flex; align-items: center; gap: 6px; justify-content: center; }
.gap-bar-bg { width: 60px; height: 8px; background: #f0f0f0; border-radius: 4px; overflow: hidden; flex-shrink: 0; }
.gap-bar-fill { height: 100%; border-radius: 4px; transition: width 0.3s; }
.gap-text { font-weight: 600; font-size: 12px; }

/* Daily badge */
.daily-badge {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 7px;
  border-radius: 10px;
  font-weight: 700;
  font-size: 12px;
  white-space: nowrap;
}

/* Subject tags */
.subject-tags { display: flex; gap: 3px; flex-wrap: wrap; justify-content: center; }
.subject-tag {
  padding: 1px 6px;
  border-radius: 8px;
  font-size: 10px;
  background: #e8f5e9;
  color: #2e7d32;
  white-space: nowrap;
}

/* Color legend */
.legend-bar {
  background: white;
  border-radius: 12px;
  padding: 12px 20px;
  margin-bottom: 20px;
  box-shadow: 0 1px 4px rgba(0,0,0,0.06);
  border: 1px solid #f0f0f5;
  display: flex;
  align-items: center;
  gap: 16px;
  font-size: 12px;
  color: #666;
  flex-wrap: wrap;
}
.legend-label { font-weight: 500; }
.legend-gradient { display: flex; align-items: center; gap: 6px; }
.legend-gradient-bar { width: 120px; height: 8px; border-radius: 4px; }
.legend-endpoints { display: flex; justify-content: space-between; width: 120px; font-size: 11px; color: #888; }

/* Footer */
.footer { text-align: center; padding: 20px; color: #ccc; font-size: 12px; }

/* Search */
.search-bar {
  padding: 12px 20px;
  border-bottom: 1px solid #f0f0f5;
  display: flex;
  gap: 10px;
  align-items: center;
}
.search-input {
  flex: 1;
  max-width: 300px;
  padding: 7px 12px;
  border: 1.5px solid #e0e0e0;
  border-radius: 8px;
  font-size: 13px;
  outline: none;
  transition: border-color 0.15s;
}
.search-input:focus { border-color: #059669; }

/* Group filter */
.group-filter {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
  padding: 10px 20px;
  border-bottom: 1px solid #f0f0f5;
}
.filter-btn {
  padding: 4px 12px;
  border-radius: 16px;
  border: 1.5px solid #d0d0d0;
  background: white;
  font-size: 12px;
  cursor: pointer;
  color: #555;
  transition: all 0.15s;
}
.filter-btn:hover { border-color: #059669; color: #059669; }
.filter-btn.active { background: #059669; border-color: #059669; color: white; }

@media (max-width: 768px) {
  .header { padding: 14px 16px; }
  .content { padding: 14px 16px; }
  .stat-card-value { font-size: 20px; }
}
</style>
</head>
<body>

<div class="header">
  <h1>📊 <span id="boardTitle">沈阳基地·续报完成率看板</span></h1>
  <div class="header-right">
    <div class="header-stat">
      <div class="header-stat-val" id="totalInclass">-</div>
      <div class="header-stat-label">在班人次</div>
    </div>
    <div class="header-stat">
      <div class="header-stat-val" id="totalXubao">-</div>
      <div class="header-stat-label">续报人次</div>
    </div>
    <div class="header-stat">
      <div class="header-stat-val" id="totalTarget">-</div>
      <div class="header-stat-label">目标人次</div>
    </div>
    <div class="header-stat">
      <div class="header-stat-val" id="totalGap">-</div>
      <div class="header-stat-label">距完标人次</div>
    </div>
    <div class="header-stat">
      <div class="header-stat-val" id="totalDaily">-</div>
      <div class="header-stat-label">今日增长人次</div>
    </div>
    <button class="refresh-btn" onclick="location.reload()">🔄 刷新数据</button>
  </div>
</div>

<div class="content">

  <!-- Stat cards -->
  <div class="stat-cards">
    <div class="stat-card">
      <div class="stat-card-label">续报人次</div>
      <div class="stat-card-value" id="scXubao">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">目标人次</div>
      <div class="stat-card-value" id="scTarget">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">距完标人次</div>
      <div class="stat-card-value" id="scGap">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">续报率</div>
      <div class="stat-card-value" id="scRate">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">目标完成率</div>
      <div class="stat-card-value" id="scComplete">-</div>
    </div>
    <div class="stat-card">
      <div class="stat-card-label">今日增长</div>
      <div class="stat-card-value" id="scDaily">-</div>
    </div>
  </div>

  <!-- Color legend -->
  <div class="legend-bar">
    <span class="legend-label">目标完成率 / 距完标进度</span>
    <div class="legend-gradient">
      <div class="legend-gradient-bar" id="legendBar"></div>
      <div class="legend-endpoints"><span id="legendMin">0%</span><span id="legendMax">100%</span></div>
    </div>
    <span style="color:#aaa;font-size:11px">越高越绿 · 越低越红</span>
    <span class="legend-note" style="margin-left:auto;font-size:11px;color:#aaa">数据更新时间：<span id="updateTime">-</span></span>
  </div>

  <!-- 学科汇总 -->
  <div class="table-section">
    <div class="table-section-header" onclick="toggleSection('subjects')">
      <span class="table-section-title">📚 学科汇总</span>
      <span class="table-section-meta" id="subjectMeta"></span>
      <span class="accordion-arrow">▼</span>
    </div>
    <div class="table-section-body" id="subjectsBody">
      <table>
        <thead id="subjectsHead"></thead>
        <tbody id="subjectsTable"></tbody>
      </table>
    </div>
  </div>

  <!-- 教学组汇总 -->
  <div class="table-section">
    <div class="table-section-header" onclick="toggleSection('groups')">
      <span class="table-section-title">👥 教学组汇总</span>
      <span class="table-section-meta" id="groupMeta"></span>
      <span class="accordion-arrow">▼</span>
    </div>
    <div class="table-section-body" id="groupsBody">
      <table>
        <thead id="groupsHead"></thead>
        <tbody id="groupsTable"></tbody>
      </table>
    </div>
  </div>

  <!-- 班主任明细 -->
  <div class="table-section">
    <div class="table-section-header" onclick="toggleSection('ct')">
      <span class="table-section-title">🏫 班主任明细</span>
      <span class="table-section-meta" id="ctMeta"></span>
      <span class="accordion-arrow">▼</span>
    </div>
    <div class="search-bar">
      <input class="search-input" id="searchInput" placeholder="搜索班主任姓名..." oninput="filterCT()">
    </div>
    <div class="group-filter" id="groupFilterBtns"></div>
    <div class="table-section-body" id="ctBody">
      <table>
        <thead id="ctHead"></thead>
        <tbody id="ctTable"></tbody>
      </table>
    </div>
  </div>

</div>

<div class="footer">续报完成率看板 · 实时数据</div>

<script>
// ─── State ──────────────────────────────────────────────────────────────────
let rawData = {};
let filteredCT = [];
let currentGroup = '全部';
let searchText = '';

// Sort state per table
let sortState = {
  subjects: { col: 'completeRate', dir: 'desc' },
  groups:   { col: 'completeRate', dir: 'desc' },
  ct:       { col: 'completeRate', dir: 'desc' },
};

// Column definitions
const COLS = {
  subjects: [
    { key: 'name',         label: '学科',         numeric: false },
    { key: 'inclass',      label: '在班人次',      numeric: true  },
    { key: 'xubao',        label: '续报人次',      numeric: true  },
    { key: 'target',       label: '目标人次',      numeric: true  },
    { key: 'gap',          label: '距完标人次',    numeric: true  },
    { key: 'daily',        label: '今日增长人次',  numeric: true  },
    { key: 'rate',         label: '续报率',        numeric: true  },
    { key: 'completeRate', label: '目标完成率',    numeric: true  },
  ],
  groups: [
    { key: 'name',         label: '教学组',        numeric: false },
    { key: 'ctCount',      label: '班主任数',      numeric: true  },
    { key: 'inclass',      label: '在班人次',      numeric: true  },
    { key: 'xubao',        label: '续报人次',      numeric: true  },
    { key: 'target',       label: '目标人次',      numeric: true  },
    { key: 'gap',          label: '距完标人次',    numeric: true  },
    { key: 'daily',        label: '今日增长人次',  numeric: true  },
    { key: 'rate',         label: '续报率',        numeric: true  },
    { key: 'completeRate', label: '目标完成率',    numeric: true  },
  ],
  ct: [
    { key: 'name',         label: '班主任',        numeric: false },
    { key: 'group',        label: '教学组',        numeric: false },
    { key: 'subjects',     label: '学科',          numeric: false },
    { key: 'inclass',      label: '在班人次',      numeric: true  },
    { key: 'xubao',        label: '续报人次',      numeric: true  },
    { key: 'target',       label: '目标人次',      numeric: true  },
    { key: 'gap',          label: '距完标人次',    numeric: true  },
    { key: 'daily',        label: '今日增长人次',  numeric: true  },
    { key: 'rate',         label: '续报率',        numeric: true  },
    { key: 'completeRate', label: '目标完成率',    numeric: true  },
  ],
};

// ─── Color helpers ───────────────────────────────────────────────────────────
function rateColorHex(rate) {
  // rate is 0-100 normalized value
  rate = Math.max(0, Math.min(100, rate));
  let r, g, b;
  if (rate <= 50) {
    const t = rate / 50;
    r = 220; g = Math.round(38 + (179 - 38) * t); b = 38;
  } else {
    const t = (rate - 50) / 50;
    r = Math.round(234 + (22 - 234) * t);
    g = Math.round(179 + (163 - 179) * t);
    b = Math.round(8 + (74 - 8) * t);
  }
  return '#' + [r, g, b].map(x => x.toString(16).padStart(2, '0')).join('');
}

// Normalize a rate to 0-100 for color mapping, based on dataset range
globalRateMin = 0;
globalRateMax = 100;

function normalizeRate(rate) {
  if (globalRateMax === globalRateMin) return 50;
  const n = (rate - globalRateMin) / (globalRateMax - globalRateMin) * 100;
  return Math.max(0, Math.min(100, n));
}

function fmt(n) { return n.toLocaleString(); }

// ─── Build legend gradient ──────────────────────────────────────────────────
function buildLegend() {
  const bar = document.getElementById('legendBar');
  const stops = [];
  for (let i = 0; i <= 20; i++) stops.push(rateColorHex(i * 5) + ' ' + (i / 20 * 100) + '%');
  bar.style.background = `linear-gradient(to right, ${stops.join(', ')})`;
  document.getElementById('legendMin').textContent = globalRateMin.toFixed(1) + '%';
  document.getElementById('legendMax').textContent = globalRateMax.toFixed(1) + '%';
}

// ─── Rate bar cell ──────────────────────────────────────────────────────────
function makeRateBar(rate) {
  const color = rateColorHex(normalizeRate(rate));
  const display = rate.toFixed(1);
  return `<div class="rate-bar-wrap">
    <div class="rate-bar-bg"><div class="rate-bar-fill" style="width:${Math.min(100, rate)}%;background:${color}"></div></div>
    <span class="rate-text" style="color:${color}">${display}%</span>
  </div>`;
}

// ─── Gap bar cell ──────────────────────────────────────────────────────────
// Over-fulfilled (xubao >= target): show green "已完成" badge
// Under target: show progress bar + gap count
function makeGapBar(gap, xubao, target) {
  if (target <= 0) return `<span class="gap-text">—</span>`;
  if (xubao >= target) {
    // Over-fulfilled: green badge
    return `<span class="gap-text" style="color:#16a34a;font-weight:700">已完成 ✓</span>`;
  }
  // Under target: progress bar colored by completion % (relative to dataset range)
  const achieved = xubao / target * 100;
  const color = rateColorHex(normalizeRate(achieved));
  return `<div class="gap-bar-wrap">
    <div class="gap-bar-bg"><div class="gap-bar-fill" style="width:${achieved.toFixed(1)}%;background:${color}"></div></div>
    <span class="gap-text" style="color:${color}">${fmt(gap)}</span>
  </div>`;
}

// ─── Daily badge ────────────────────────────────────────────────────────────
// Color scale based on percentile within current visible list
function makeDailyBadge(daily, maxDaily, medianDaily) {
  if (daily <= 0) return `<span class="daily-badge" style="background:#f0f0f0;color:#bbb">0</span>`;
  // Tiered color: dark-green (top) → mid-green → light-green, always white text
  let bg, text = '#fff';
  if (daily >= maxDaily) {
    bg = '#15803d'; // deep green
  } else if (daily >= medianDaily) {
    const t = (daily - medianDaily) / (maxDaily - medianDaily);
    // median→max: light green → deep green
    const r = Math.round(34  + (21 - 34) * t);
    const g = Math.round(197 + (128 - 197) * t);
    const b = Math.round(100 + (61 - 100) * t);
    bg = `rgb(${r},${g},${b})`;
  } else {
    const t = daily / Math.max(medianDaily, 1);
    // 1→median: very light green
    const r = Math.round(220 + (34 - 220) * t);
    const g = Math.round(240 + (197 - 240) * t);
    const b = Math.round(230 + (100 - 230) * t);
    bg = `rgb(${r},${g},${b})`;
  }
  return `<span class="daily-badge" style="background:${bg};color:${text}">+${fmt(daily)}</span>`;
}

// ─── Column header builder ──────────────────────────────────────────────────
function buildThead(tableKey) {
  const thead = document.getElementById(tableKey + 'Head');
  const state = sortState[tableKey];
  const cols = COLS[tableKey];
  thead.innerHTML = `<tr>${cols.map(c => {
    const isActive = state.col === c.key;
    const icon = isActive ? (state.dir === 'asc' ? '↑' : '↓') : '↕';
    return `<th data-col="${c.key}" data-table="${tableKey}" class="${isActive ? 'sort-' + state.dir : ''}">
      ${c.label}<span class="sort-icon">${icon}</span>
    </th>`;
  }).join('')}</tr>`;

  thead.querySelectorAll('th').forEach(th => {
    th.addEventListener('click', () => handleSort(th.dataset.table, th.dataset.col));
  });
}

function handleSort(table, col) {
  const s = sortState[table];
  if (s.col === col) {
    s.dir = s.dir === 'asc' ? 'desc' : 'asc';
  } else {
    s.col = col;
    s.dir = 'desc';
  }
  // Re-render thead to update icons
  buildThead(table);
  renderTable(table);
}

// ─── Generic sort function ──────────────────────────────────────────────────
function applySort(data, tableKey) {
  const { col, dir } = sortState[tableKey];
  const colDef = COLS[tableKey].find(c => c.key === col);
  return [...data].sort((a, b) => {
    let av = a[col], bv = b[col];
    if (col === 'subjects') { av = Array.isArray(av) ? av.join() : ''; bv = Array.isArray(bv) ? bv.join() : ''; }
    if (colDef.numeric) { av = Number(av) || 0; bv = Number(bv) || 0; }
    if (av < bv) return dir === 'asc' ? -1 : 1;
    if (av > bv) return dir === 'asc' ? 1 : -1;
    return 0;
  });
}

// ─── Toggle section ─────────────────────────────────────────────────────────
function toggleSection(name) {
  const header = event.currentTarget;
  const body = document.getElementById(name + 'Body');
  header.classList.toggle('open');
  body.classList.toggle('collapsed');
}

// ─── Render functions ───────────────────────────────────────────────────────
function renderSubjects() {
  buildThead('subjects');
  renderTable('subjects');
  document.getElementById('subjectMeta').textContent = `共 ${rawData.subjects.length} 个学科`;
}

function renderGroups() {
  buildThead('groups');
  renderTable('groups');
  document.getElementById('groupMeta').textContent = `共 ${rawData.groups.length} 个教学组`;
}

function renderTable(tableKey) {
  const tbody = document.getElementById(tableKey + 'Table');
  const cols = COLS[tableKey];
  let data = tableKey === 'ct' ? getFilteredCT() : rawData[tableKey];
  data = applySort(data, tableKey);

  // For CT table, precompute daily stats for badge coloring
  let maxDaily = 0, medianDaily = 0;
  if (tableKey === 'ct' && data.length > 0) {
    const dailies = data.map(c => c.daily).sort((a, b) => a - b);
    maxDaily = dailies[dailies.length - 1];
    medianDaily = dailies[Math.floor(dailies.length / 2)];
  }

  tbody.innerHTML = data.map(row => {
    const cells = cols.map(c => {
      const val = row[c.key];
      if (c.key === 'name') return `<td class="td-name">${val}`;
      if (c.key === 'subjects') {
        return `<td><div class="subject-tags">${Array.isArray(val) ? val.map(s => `<span class="subject-tag">${s}</span>`).join('') : val}</div></td>`;
      }
      if (c.key === 'rate') return `<td style="font-variant-numeric:tabular-nums">${val.toFixed(1)}%</td>`;
      if (c.key === 'completeRate') return `<td><div class="rate-cell">${makeRateBar(val)}</div></td>`;
      if (c.key === 'gap') {
        // CT uses gap bar, others just show number
        if (tableKey === 'ct') {
          return `<td><div class="gap-cell">${makeGapBar(val, row.xubao, row.target)}</div></td>`;
        }
        return `<td>${fmt(val)}</td>`;
      }
      if (c.key === 'daily') {
        if (tableKey === 'ct') {
          return `<td>${makeDailyBadge(val, maxDaily, medianDaily)}</td>`;
        }
        return `<td>+${fmt(val)}</td>`;
      }
      if (c.numeric) return `<td>${fmt(val)}</td>`;
      return `<td>${val}</td>`;
    });
    return `<tr>${cells.join('')}</tr>`;
  }).join('');
}

function getFilteredCT() {
  let list = rawData.classTeachers;
  if (currentGroup !== '全部') list = list.filter(c => c.group === currentGroup);
  if (searchText) list = list.filter(c => c.name.toLowerCase().includes(searchText));
  return list;
}

function renderCT() {
  buildThead('ct');
  renderTable('ct');
  const list = getFilteredCT();
  document.getElementById('ctMeta').textContent = `共 ${list.length} 位班主任`;
}

function renderGroupFilter() {
  const container = document.getElementById('groupFilterBtns');
  const allGroups = ['全部', ...new Set(rawData.classTeachers.map(c => c.group))].sort();
  container.innerHTML = allGroups.map(g => {
    const active = g === currentGroup ? 'active' : '';
    return `<button class="filter-btn ${active}" onclick="setGroup('${g}')">${g}</button>`;
  }).join('');
}

function setGroup(g) {
  currentGroup = g;
  renderGroupFilter();
  renderCT();
}

function filterCT() {
  searchText = document.getElementById('searchInput').value.trim().toLowerCase();
  renderCT();
}

function renderHeader() {
  const m = rawData.meta;
  const fmt2 = n => n.toLocaleString();
  document.getElementById('totalInclass').textContent = fmt2(m.totalInclass);
  document.getElementById('totalXubao').textContent = fmt2(m.totalXubao);
  document.getElementById('totalTarget').textContent = fmt2(m.totalTarget);
  document.getElementById('totalGap').textContent = fmt2(m.totalGap);
  document.getElementById('totalDaily').textContent = '+' + fmt2(m.totalDaily);
  document.getElementById('scXubao').textContent = fmt2(m.totalXubao);
  document.getElementById('scTarget').textContent = fmt2(m.totalTarget);
  document.getElementById('scGap').textContent = fmt2(m.totalGap);
  document.getElementById('scRate').textContent = m.totalRate + '%';
  document.getElementById('scComplete').textContent = m.totalCompleteRate + '%';
  document.getElementById('scDaily').textContent = '+' + fmt2(m.totalDaily);
  document.getElementById('updateTime').textContent = m.updated;
}

function loadData() {
  fetch('xubao_data.json')
    .then(r => r.json())
    .then(d => {
      rawData = d;

      // 计算全局完成率范围（用于相对颜色）
      const allRates = d.classTeachers.map(c => c.completeRate);
      globalRateMin = Math.min(...allRates);
      globalRateMax = Math.max(...allRates);

      buildLegend();
      renderHeader();
      renderSubjects();
      renderGroups();
      renderGroupFilter();
      renderCT();
      document.querySelectorAll('.table-section-header').forEach(h => h.classList.add('open'));
    });
}

loadData();
</script>
</body>
</html>
